    } else if (!v.images.length) {
      body = '<div class="flex flex-col items-center gap-2 opacity-60"><span style="font-size:36px">✨</span><span class="font-nunito text-sm" style="color:#a78bba">说出你的想法，AI 一次画两张哦 🎨</span></div>';
    } else {
      body = '<div class="flex flex-1 items-center justify-center gap-4 min-h-0 flex-wrap">' + v.images.map((img, idx) => (

        + '<div class="flex gap-2">'
        + '<button type="button" class="voice-save flex-1 py-1.5 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-[11px] border-none active:scale-95" data-img-id="' + img.id + '" style="background:' + (v.saved[img.id] ? '#dcfce7' : '#f3e8ff') + ';color:' + (v.saved[img.id] ? '#15803d' : '#7e22ce') + '">' + iconDownload() + (v.saved[img.id] ? '已保存' : '保存') + '</button>'
        + '<button type="button" class="voice-print flex-1 py-1.5 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-[11px] border-none active:scale-95" data-img-id="' + img.id + '" ' + (v.printed[img.id] ? 'disabled' : '') + ' style="background:' + (v.printed[img.id] ? '#dcfce7' : 'linear-gradient(135deg,#a855f7,#ec4899)') + ';color:' + (v.printed[img.id] ? '#15803d' : 'white') + '">' + iconPrinter() + (v.printed[img.id] ? '已打印' : '打印') + '</button>'

    return '<div class="flex flex-col h-full p-4 gap-3 overflow-auto">'

      + '<button type="button" id="voice-mic" class="relative w-14 h-14 rounded-full flex items-center justify-center shadow-lg shrink-0 border-4 border-white active:scale-95" style="background:' + (v.listening ? 'linear-gradient(135deg,#f43f5e,#ec4899)' : 'linear-gradient(135deg,#a855f7,#c084fc)') + '">' + iconMic(v.listening) + '</button>'
      + '<div class="flex-1 min-w-0"><div class="font-fredoka text-sm" style="color:#7e22ce">🎨 语音涂鸦</div>'

      + '</div>'

      + '</div>'

  function allLineItems() {
    return Object.values(lineArtData).flat();
  }

  function filteredLine() {
    return lineArtData[state.line.cat] || [];
  }

  function modeBadge(mode) {
    const m = modes.find(x => x.id === mode);
    return '<span class="absolute top-2 right-2 px-2 py-0.5 rounded-full font-nunito text-[9px] font-bold" style="background:rgba(255,255,255,0.88);color:#7e22ce">' + m.emoji + ' ' + m.label + '</span>';
  }

  function previewMarks(mode) {
    if (mode === 'outline') return '';
    const marks = mode === 'dots' ? ['·1','·2','·3','·4','·5','·6','·7','·8'] : mode === 'numbers' ? ['1','2','3','4','5','6','7','8'] : ['A','B','C','D','E','F','G','H'];
    const pos = [
      { top: '18%', left: '15%' }, { top: '15%', left: '76%' }, { top: '38%', left: '10%' }, { top: '40%', left: '82%' },
      { top: '62%', left: '14%' }, { top: '60%', left: '78%' }, { top: '80%', left: '30%' }, { top: '82%', left: '63%' },
    ];
    return marks.map((t, i) => '<span class="absolute font-nunito text-[11px] font-bold" style="top:' + pos[i].top + ';left:' + pos[i].left + ';color:#a855f7">' + t + '</span>').join('');
  }

  function renderLinePanel() {
    const s = state.line;
    const list = filteredLine();
    const key = s.preview ? s.preview.name + '-' + s.mode : '';
    const left = '<div class="w-full sm:w-[44%] flex flex-col gap-2 min-h-0">'
      + '<div class="flex gap-1.5 flex-wrap shrink-0">' + categories.map(cat => (
        '<button type="button" class="line-cat px-3 py-1 rounded-full font-nunito font-bold text-[11px] border-none active:scale-95" data-cat="' + cat + '" style="background:' + (s.cat === cat ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#f3e8ff') + ';color:' + (s.cat === cat ? 'white' : '#7c6a90') + '">' + cat + '</button>'
      )).join('') + '</div>'
      + '<div class="grid grid-cols-2 gap-2 flex-1 overflow-y-auto pr-1 content-start max-h-[40vh] sm:max-h-none">'
      + list.map(item => (
        '<button type="button" class="line-pick flex flex-col gap-1 rounded-xl p-1.5 cursor-pointer active:scale-95 text-left" data-name="' + item.name + '" style="background:' + (s.preview && s.preview.name === item.name ? 'linear-gradient(135deg,#fbcfe8,#ddd6fe)' : 'white') + ';border:' + (s.preview && s.preview.name === item.name ? '2px solid #c084fc' : '2px solid rgba(168,85,247,0.15)') + ';box-shadow:0 2px 8px rgba(168,85,247,0.08)">'
        + '<div class="w-full rounded-lg flex items-center justify-center relative overflow-hidden" style="aspect-ratio:210/148;background:' + item.bg + ';filter:grayscale(0.35)"><span style="font-size:34px">' + item.emoji + '</span></div>'
        + '<span class="text-center font-nunito text-[10px]" style="color:#7c6a90">' + item.name + '</span></button>'
      )).join('') + '</div></div>';

    const rightPreview = s.preview
      ? '<div class="rounded-2xl flex flex-col items-center justify-center relative w-full" style="aspect-ratio:210/148;max-height:100%;background:' + s.preview.bg + ';border:3px dashed rgba(168,85,247,0.35);box-shadow:0 8px 24px rgba(168,85,247,0.15);filter:grayscale(0.55)">'
        + modeBadge(s.mode) + previewMarks(s.mode)
        + '<span style="font-size:84px;opacity:0.6">' + s.preview.emoji + '</span>'
        + '<span class="font-fredoka text-[13px] mt-0.5" style="color:#5b21b6">' + s.preview.name + '</span></div>'
      : '<div class="flex flex-col items-center gap-2 opacity-60"><span style="font-size:30px">✨</span><span class="font-nunito text-xs sm:text-sm" style="color:#a78bba">' + (s.generating ? 'AI 正在生成线稿...' : '语音生成 或 从左边挑模板') + '</span></div>';

    const rightBtns = s.preview ? '<div class="flex gap-2 shrink-0">'
      + '<button type="button" id="line-save" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-xs border-none active:scale-95" style="background:' + (s.saved ? '#dcfce7' : '#f3e8ff') + ';color:' + (s.saved ? '#15803d' : '#7e22ce') + '">' + iconDownload() + (s.saved ? '已保存' : '保存') + '</button>'
      + '<button type="button" id="line-print" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-xs border-none active:scale-95" ' + (s.printed ? 'disabled' : '') + ' style="background:' + (s.printed ? '#dcfce7' : 'linear-gradient(135deg,#a855f7,#ec4899)') + ';color:' + (s.printed ? '#15803d' : 'white') + '">' + iconPrinter() + (s.printed ? '已打印' : '打印') + '</button>'
      + '</div>' : '';

    return '<div class="flex flex-col h-full p-4 gap-3 overflow-hidden">'
      + '<div class="flex items-center gap-3 rounded-2xl px-4 py-3 shrink-0" style="background:linear-gradient(135deg,#fdf4ff,#fce7f3);border:2px dashed rgba(192,132,252,0.3)">'
      + '<button type="button" id="line-mic" class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg shrink-0 border-[3px] border-white active:scale-95" style="background:' + (s.listening ? 'linear-gradient(135deg,#f43f5e,#ec4899)' : 'linear-gradient(135deg,#a855f7,#c084fc)') + '">' + iconMic(s.listening) + '</button>'
      + '<div class="flex-1 min-w-0"><div class="font-fredoka text-sm" style="color:#7e22ce">✏️ 语音生成线稿</div>'
      + (s.transcript ? '<div class="truncate font-nunito text-xs" style="color:#3d2a5a">「' + s.transcript + '」' + (s.generating ? ' · 生成中...' : '') + '</div>'
        : '<div class="font-nunito text-xs" style="color:#a78bba">' + (s.listening ? '🎙️ 正在听...' : '说出你想要的线稿，或从下方挑选模板') + '</div>') + '</div></div>'
      + '<div class="flex flex-col sm:flex-row gap-4 flex-1 min-h-0 overflow-hidden">' + left
      + '<div class="flex-1 flex flex-col gap-2 min-h-0">'
      + '<div class="grid grid-cols-4 gap-1.5 shrink-0">' + modes.map(m => (
        '<button type="button" class="line-mode py-1.5 rounded-xl flex flex-col items-center gap-0.5 font-nunito font-bold border-none active:scale-95" data-mode="' + m.id + '" style="background:' + (s.mode === m.id ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#f3e8ff') + ';color:' + (s.mode === m.id ? 'white' : '#7c6a90') + '"><span style="font-size:14px">' + m.emoji + '</span><span style="font-size:10px">' + m.label + '</span></button>'
      )).join('') + '</div>'
      + '<div class="flex-1 flex items-center justify-center min-h-0 overflow-hidden">' + rightPreview + '</div>' + rightBtns + '</div></div></div>';
  }

  function bookSelectedTheme() {
    return state.book.themeId ? themes.find(t => t.id === state.book.themeId) : null;
  }

  function renderBookPanel() {
    const b = state.book;
    const st = bookSelectedTheme();
    const pal = b.themeId ? palette[b.themeId] : null;
    const tabLabel = { scene: '🎨 场景', characters: '👫 人物', items: '🎁 物品' };
    const voiceSub = b.btab === 'scene' ? '场景' : b.btab === 'characters' ? '人物' : '物品';

    const voiceBar = '<div class="flex items-center gap-3 rounded-2xl px-4 py-3 shrink-0" style="background:linear-gradient(135deg,#fdf4ff,#fce7f3);border:2px dashed rgba(192,132,252,0.3)">'
      + '<button type="button" id="book-mic" class="relative w-12 h-12 rounded-full flex items-center justify-center shadow-lg shrink-0 border-[3px] border-white active:scale-95" style="background:' + (b.listening ? 'linear-gradient(135deg,#f43f5e,#ec4899)' : 'linear-gradient(135deg,#a855f7,#c084fc)') + '">'
      + (b.listening ? '<span class="absolute inset-0 rounded-full opacity-30 animate-ping" style="background:#f43f5e"></span>' : '')
      + iconMic(b.listening).replace('width="20"', 'width="18"').replace('height="20"', 'height="18"') + '</button>'

      + (b.transcript
        ? '<div class="truncate font-nunito text-xs" style="color:#3d2a5a">「' + b.transcript + '」' + (b.generating ? ' · AI 生成中...' : '') + '</div>'
        : '<div class="font-nunito text-xs" style="color:#a78bba">' + (b.listening ? '🎙️ 正在听...' : '说出你想要的' + tabLabel[b.btab] + '，AI 帮你生成 ✨') + '</div>')
      + '</div></div>';

    let banner = '';
    if (b.voiceResult && b.btab !== 'scene') {
      const pr = b.printed[b.voiceResult.name];
      banner = '<div class="flex items-center gap-2 rounded-xl px-3 py-2 shrink-0 flex-wrap" style="background:white;border:2px solid #c084fc">'
        + '<span style="font-size:22px">' + b.voiceResult.emoji + '</span>'
        + '<span class="font-nunito text-xs font-bold flex-1 min-w-[120px]" style="color:#5b21b6">AI 生成：' + b.voiceResult.name + '</span>'
        + '<button type="button" id="book-vr-add" class="px-2 py-1 rounded-lg font-nunito font-bold text-[11px] border-none active:scale-95" style="background:linear-gradient(135deg,#a855f7,#ec4899);color:white">➕ 加入场景</button>'
        + '<button type="button" id="book-vr-print" class="px-2 py-1 rounded-lg font-nunito font-bold text-[11px] border-none active:scale-95 flex items-center gap-1" style="background:' + (pr ? '#dcfce7' : '#f3e8ff') + ';color:' + (pr ? '#15803d' : '#7e22ce') + '">'
        + (pr ? '✓ 已打印' : iconPrinter().replace('width="12"', 'width="10"').replace('height="12"', 'height="10"') + '<span>单独打印</span>') + '</button>'
        + '<button type="button" id="book-vr-close" class="border-none bg-transparent text-[16px] leading-none cursor-pointer px-1" style="color:#a78bba">×</button>'
        + '</div>';
    }

    const mainTabs = (['scene', 'characters', 'items']).map(tid => {
      const active = b.btab === tid;
      const ic = tid === 'scene' ? '🎨' : tid === 'characters' ? '👫' : '🎁';
      const tx = tid === 'scene' ? '场景' : tid === 'characters' ? '人物' : '物品';
      return '<button type="button" class="book-main-tab py-2 rounded-xl flex flex-col items-center gap-0.5 font-nunito font-bold text-[11px] border-none active:scale-95" data-book-tab="' + tid + '" style="background:' + (active ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#f3e8ff') + ';color:' + (active ? 'white' : '#7c6a90') + '"><span style="font-size:16px">' + ic + '</span><span>' + tx + '</span></button>';
    }).join('');

    let scrollInner = '';
    if (b.btab === 'scene') {
      scrollInner = '<div class="flex flex-col gap-2">' + themes.map(theme => {
        const sel = b.themeId === theme.id;
        return '<button type="button" class="book-pick-theme w-full rounded-2xl px-3 py-2.5 flex items-center gap-3 font-nunito font-bold text-[13px] border-none active:scale-95 text-left" data-theme="' + theme.id + '" style="background:' + (sel ? 'linear-gradient(135deg,#a855f7,#ec4899)' : theme.color) + ';color:' + (sel ? 'white' : '#3d2a5a') + ';border:' + (sel ? '2px solid #c084fc' : '2px solid rgba(168,85,247,0.15)') + '">'
          + '<span style="font-size:26px">' + theme.emoji + '</span><div class="flex flex-col items-start min-w-0 flex-1"><span>' + theme.label + '</span><span style="font-size:18px;line-height:1;opacity:0.8">' + theme.scene + '</span></div>'
          + (sel ? '<span class="text-sm shrink-0">✓</span>' : '')
          + '</button>';
      }).join('') + (!b.themeId ? '<p class="text-center mt-1 font-nunito text-[11px]" style="color:#a78bba">点选一个场景开始创作 ✨</p>' : '') + '</div>';
    } else if (!pal) {
      scrollInner = '<div class="flex flex-col items-center justify-center gap-2 opacity-60 py-8"><span style="font-size:32px">👈</span><span class="font-nunito text-xs text-center px-2" style="color:#a78bba">先在「场景」tab 选一个主题</span></div>';
    } else {
      const list = b.btab === 'characters' ? pal.characters : pal.items;
      scrollInner = '<div class="grid grid-cols-3 gap-2">' + list.map(item => (
        '<button type="button" class="book-add rounded-xl flex flex-col items-center justify-center gap-0.5 p-2 border-none active:scale-90" style="background:white;border:2px solid rgba(168,85,247,0.18);box-shadow:0 2px 6px rgba(168,85,247,0.08);aspect-ratio:1" data-emoji="' + item.emoji + '" data-name="' + item.name + '">'
        + '<span style="font-size:28px">' + item.emoji + '</span><span class="font-nunito text-[10px]" style="color:#7c6a90">' + item.name + '</span></button>'
      )).join('') + '</div>';
    }

    let placedListHtml = '';
    if ((b.btab === 'characters' || b.btab === 'items') && b.placed.length > 0) {
      placedListHtml = '<div class="rounded-xl p-2 shrink-0 flex flex-col gap-1 font-nunito" style="background:#faf5ff;border:2px solid rgba(192,132,252,0.2);max-height:100px;overflow-y:auto">'

        + b.placed.map(p => {
          const pe = b.printed[p.name];
          return '<div class="flex items-center gap-1.5">'
            + '<span style="font-size:14px">' + p.emoji + '</span><span class="text-[10px] flex-1 truncate" style="color:#5b21b6">' + p.name + '</span>'
            + '<button type="button" class="book-elem-print px-1.5 py-0.5 rounded-full border-none font-nunito text-[9px] active:scale-95" data-pname="' + p.name + '" data-pemoji="' + p.emoji + '" style="background:' + (pe ? '#dcfce7' : '#a855f7') + ';color:' + (pe ? '#15803d' : 'white') + '">' + (pe ? '✓' : '⎙') + '</button>'
            + '<button type="button" class="book-remove-placed border-none bg-transparent text-[14px] leading-none cursor-pointer px-0.5" style="color:#d1d5db" data-pid="' + p.id + '">×</button></div>';
        }).join('')
        + '</div>';
    }

    let previewHtml;
    if (st) {
      previewHtml = '<div class="rounded-2xl relative overflow-hidden w-full" style="aspect-ratio:210/148;max-height:100%;background:' + st.color + ';border:3px dashed rgba(168,85,247,0.3);box-shadow:0 8px 24px rgba(168,85,247,0.15)">'
        + '<div class="absolute inset-0 flex items-end justify-center pb-6 pointer-events-none select-none" style="opacity:0.2"><span style="font-size:80px">' + st.scene + '</span></div>'

    }
    const starred = w.filter(x => x.starred);
    const others = w.filter(x => !x.starred);
    function card(work) {
      const tc = typeColors[work.type] || '#a855f7';
      const tb = typeBg[work.type] || '#f3e8ff';
      return '<div class="flex items-center gap-3 rounded-2xl p-3" style="background:white;border:2px solid rgba(168,85,247,0.12);box-shadow:0 2px 12px rgba(168,85,247,0.07)">'
        + '<div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background:' + tb + '"><span style="font-size:26px">' + work.emoji + '</span></div>'
        + '<div class="flex-1 min-w-0"><p class="truncate text-sm font-nunito font-bold" style="color:#3d2a5a">' + work.desc + '</p>'
        + '<div class="flex items-center gap-1 mt-0.5"><span class="text-xs px-2 py-0.5 rounded-full font-nunito font-bold" style="background:' + tb + ';color:' + tc + '">' + work.type + '</span>'

        + '<div class="flex flex-col gap-1 shrink-0">'

        + '<button type="button" class="work-print p-1.5 rounded-lg border-none cursor-pointer active:scale-90" style="background:#f3e8ff" data-id="' + work.id + '">' + iconPrinter().replace('width="12"', 'width="14"').replace('height="12"', 'height="14"').replace('stroke="currentColor"', 'stroke="#a855f7"') + '</button>'
        + '<button type="button" class="work-del p-1.5 rounded-lg border-none cursor-pointer active:scale-90" style="background:#fff1f2" data-id="' + work.id + '">' + iconTrash() + '</button>'
        + '</div></div>';

    let html = '<div class="flex flex-col gap-3 p-4 h-full overflow-y-auto">'
      + '<div class="flex items-center justify-between"><span class="text-xs font-nunito" style="color:#7c6a90">共 ' + w.length + ' 件作品</span>'
      + '<div class="flex items-center gap-1 text-xs font-nunito font-bold" style="color:#f59e0b">' + iconStar(true).replace('width="14"', 'width="12"').replace('height="14"', 'height="12"') + starred.length + ' 收藏</div></div>';
    if (starred.length) {
      html += '<p class="text-xs font-nunito font-bold" style="color:#f59e0b">⭐ 我的收藏</p>' + starred.map(card).join('<div class="h-2"></div>');
      html += '<div class="h-2"></div>';
    }
    if (others.length) {
      if (starred.length) html += '<p class="text-xs font-nunito font-bold" style="color:#7c6a90">全部作品</p>';
      html += others.map(card).join('<div class="h-2"></div>');

  function render() {

    const workHint = state.works.length ? '<p class="text-center mt-3 font-nunito text-xs" style="color:#a78bba">你已经打印了 <span style="color:#7e22ce;font-weight:700">' + state.works.length + '</span> 个作品啦 🌟</p>' : '';

      + renderTopBar()

  function resetBookState() {
    state.book = {
      btab: 'scene',
      themeId: null,
      placed: [],
      saved: false,
      printed: {},
      listening: false,
      transcript: '',
      generating: false,
      voiceResult: null,
    };
  }

  function wire() {
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('data-tab');
        if (next === 'book') resetBookState();
        state.activeTab = next;
        render();
      });
    });
    const st = document.getElementById('btn-settings');
    if (st) st.addEventListener('click', () => { state.showSettings = true; render(); });
    const sb = document.getElementById('sub-back');
    if (sb) sb.addEventListener('click', () => {
      if (state.activeTab === 'book') resetBookState();
      state.activeTab = null;
      render();
    });
    const sbb = document.getElementById('settings-back');
    if (sbb) sbb.addEventListener('click', () => { state.showSettings = false; render(); });
    const tc = document.getElementById('toast-close');
    if (tc) tc.addEventListener('click', () => { state.printToast = null; render(); });

    const vm = document.getElementById('voice-mic');
    if (vm) vm.addEventListener('click', onVoiceMic);
    const vr = document.getElementById('voice-regen');
    if (vr) vr.addEventListener('click', () => { genVoiceImages(); });

    document.querySelectorAll('.voice-save').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-img-id');
      state.voice.saved[id] = true; render();
    }));
    document.querySelectorAll('.voice-print').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-img-id');
      const img = state.voice.images.find(x => x.id === id);
      if (img && !state.voice.printed[id]) {
        state.voice.printed[id] = true;
        addWork(img.emoji, img.desc, '涂鸦');
        render();
      }
    }));

    document.querySelectorAll('.line-cat').forEach(b => b.addEventListener('click', e => {
      state.line.cat = e.currentTarget.getAttribute('data-cat'); state.line.preview = null; state.line.saved = false; state.line.printed = false; render();
    }));
    document.querySelectorAll('.line-pick').forEach(b => b.addEventListener('click', e => {
      const name = e.currentTarget.getAttribute('data-name');
      const item = allLineItems().find(x => x.name === name);
      state.line.preview = item; state.line.saved = false; state.line.printed = false; render();
    }));
    document.querySelectorAll('.line-mode').forEach(b => b.addEventListener('click', e => {
      state.line.mode = e.currentTarget.getAttribute('data-mode'); render();
    }));
    const lsv = document.getElementById('line-save');
    if (lsv) lsv.addEventListener('click', () => { state.line.saved = true; render(); });
    const lpr = document.getElementById('line-print');
    if (lpr) lpr.addEventListener('click', () => {
      if (!state.line.preview || state.line.printed) return;
      const m = modes.find(x => x.id === state.line.mode);
      addWork(state.line.preview.emoji, state.line.preview.name + ' · ' + m.label, '线稿');
      state.line.printed = true; render();
    });
    const lm = document.getElementById('line-mic');
    if (lm) lm.addEventListener('click', onLineMic);

    const bm = document.getElementById('book-mic');
    if (bm) bm.addEventListener('click', onBookMic);

    document.querySelectorAll('.book-main-tab').forEach(b => b.addEventListener('click', e => {
      state.book.btab = e.currentTarget.getAttribute('data-book-tab');
      state.book.voiceResult = null;
      render();
    }));
    document.querySelectorAll('.book-pick-theme').forEach(b => b.addEventListener('click', e => {
      state.book.themeId = e.currentTarget.getAttribute('data-theme');
      state.book.saved = false;
      render();
    }));

    const bvrAdd = document.getElementById('book-vr-add');
    if (bvrAdd) bvrAdd.addEventListener('click', () => {
      const vr = state.book.voiceResult;
      if (!vr) return;
      state.book.placed.push({
        id: String(Date.now() + Math.random()),
        emoji: vr.emoji,
        name: vr.name,
        x: 12 + Math.random() * 76,
        y: 15 + Math.random() * 60,
        size: 28 + Math.random() * 18,
      });
      state.book.voiceResult = null;
      state.book.saved = false;
      render();
    });
    const bvrPrint = document.getElementById('book-vr-print');
    if (bvrPrint) bvrPrint.addEventListener('click', () => {
      const vr = state.book.voiceResult;
      if (!vr || state.book.printed[vr.name]) return;
      addWork(vr.emoji, vr.name + ' · 人物/物品', '安静书');
      state.book.printed[vr.name] = true;
      render();
    });
    const bvrClose = document.getElementById('book-vr-close');
    if (bvrClose) bvrClose.addEventListener('click', () => { state.book.voiceResult = null; render(); });

    document.querySelectorAll('.book-add').forEach(b => b.addEventListener('click', e => {
      const emoji = e.currentTarget.getAttribute('data-emoji');
      const name = e.currentTarget.getAttribute('data-name');
      state.book.placed.push({
        id: String(Date.now() + Math.random()),
        emoji, name,
        x: 12 + Math.random() * 76,
        y: 15 + Math.random() * 60,
        size: 28 + Math.random() * 18,
      });
      state.book.saved = false;
      render();
    }));
    document.querySelectorAll('.book-placed').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      state.book.placed = state.book.placed.filter(p => p.id !== id);
      render();
    }));
    const bcp = document.getElementById('book-clear-placed');
    if (bcp) bcp.addEventListener('click', () => { state.book.placed = []; state.book.saved = false; render(); });

    document.querySelectorAll('.book-elem-print').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const name = e.currentTarget.getAttribute('data-pname');
      const emoji = e.currentTarget.getAttribute('data-pemoji');
      if (state.book.printed[name]) return;
      addWork(emoji, name + ' · 人物/物品', '安静书');
      state.book.printed[name] = true;
      render();
    }));
    document.querySelectorAll('.book-remove-placed').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      const id = e.currentTarget.getAttribute('data-pid');
      state.book.placed = state.book.placed.filter(p => p.id !== id);
      state.book.saved = false;
      render();
    }));

    const bsa = document.getElementById('book-save');
    if (bsa) bsa.addEventListener('click', () => { if (bookSelectedTheme()) { state.book.saved = true; render(); } });
    const bps = document.getElementById('book-print-scene');
    if (bps) bps.addEventListener('click', () => {
      const t = bookSelectedTheme();
      if (!t) return;
      addWork(t.emoji, t.label + ' · 背景场景', '安静书');
      state.book.printed.scene = true;
      render();
    });
    const bpf = document.getElementById('book-print-full');
    if (bpf) bpf.addEventListener('click', () => {
      const t = bookSelectedTheme();
      if (!t) return;
      addWork(t.emoji, t.label + ' · 完整画面', '安静书');
      state.book.printed.full = true;
      render();
    });

    document.querySelectorAll('.work-star').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      state.works = state.works.map(w => w.id === id ? { ...w, starred: !w.starred } : w); render();
    }));
    document.querySelectorAll('.work-print').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      const w = state.works.find(x => x.id === id);
      if (w) showToast(w.emoji, w.desc);
    }));
    document.querySelectorAll('.work-del').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      state.works = state.works.filter(w => w.id !== id); render();
    }));
  }

  function onBookMic() {
    const b = state.book;
    if (b.listening || b.generating) return;
    clearTimers();
    b.listening = true;
    b.transcript = '';
    b.voiceResult = null;

    let prompt = '';
    let onDone = function () {};

    if (b.btab === 'scene') {
      const pool = voicePool.scene;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      prompt = pick.prompt;
      onDone = function () {
        b.generating = true;
        render();
        setTimeout(function () {
          b.themeId = pick.themeId;
          b.generating = false;
          b.saved = false;
          render();
        }, 1000);
      };
    } else if (b.btab === 'characters') {
      const pool = voicePool.characters;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      prompt = pick.prompt;
      onDone = function () {
        b.generating = true;
        render();
        setTimeout(function () {
          b.voiceResult = { emoji: pick.emoji, name: pick.name };
          b.generating = false;
          render();
        }, 1000);
      };
    } else {
      const pool = voicePool.items;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      prompt = pick.prompt;
      onDone = function () {
        b.generating = true;
        render();
        setTimeout(function () {
          b.voiceResult = { emoji: pick.emoji, name: pick.name };
          b.generating = false;
          render();
        }, 1000);
      };
    }

    let i = 0;
    const timer = setInterval(function () {
      i++;
      b.transcript = prompt.slice(0, i);
      render();
      if (i >= prompt.length) {
        clearInterval(timer);
        b.listening = false;
        onDone();
      }
    }, 55);
    state.timers.push(timer);
    render();
  }

  function onVoiceMic() {
    const v = state.voice;
    if (v.generating) return;
    if (v.listening) { v.listening = false; clearTimers(); if (v.transcript) setTimeout(genVoiceImages, 400); render(); return; }
    v.listening = true; v.transcript = ''; v.images = []; v.saved = {}; v.printed = {};
    const p = prompts[Math.floor(Math.random() * prompts.length)];
    let i = 0;
    const t = setInterval(() => {
      i++; v.transcript = p.slice(0, i); render();
      if (i >= p.length) { clearInterval(t); v.listening = false; setTimeout(genVoiceImages, 400); }
    }, 55);
    state.timers.push(t);
    render();
  }

  function clearTimers() { state.timers.forEach(clearInterval); state.timers = []; }

  function genVoiceImages() {
    state.voice.generating = true; render();
    setTimeout(() => {
      const shuffled = [...imagePool].sort(() => Math.random() - 0.5);
      state.voice.images = shuffled.slice(0, 2).map((p, idx) => ({ ...p, id: Date.now() + '-' + idx }));
      state.voice.generating = false; render();
    }, 1500);
  }

  const voicePromptsLine = ['可爱的小恐龙', '美人鱼公主', '魔法独角兽', '森林精灵小屋'];

  function onLineMic() {
    const s = state.line;
    if (s.listening || s.generating) return;
    s.listening = true; s.transcript = '';
    const p = voicePromptsLine[Math.floor(Math.random() * voicePromptsLine.length)];
    let i = 0;
    const t = setInterval(() => {
      i++; s.transcript = p.slice(0, i); render();
      if (i >= p.length) {
        clearInterval(t); s.listening = false; s.generating = true; render();
        setTimeout(() => {
          const all = allLineItems();
          s.preview = all[Math.floor(Math.random() * all.length)];
          s.generating = false; s.saved = false; s.printed = false; render();
        }, 1500);
      }
    }, 55);
  }

  render();
})();
</script>
</body>
</html>
