  <title>奇想印印 · 儿童打印站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['"Fredoka One"', 'Fredoka', 'cursive', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    .font-fredoka { font-family: "Fredoka One", Fredoka, cursive, sans-serif; }
    .font-nunito { font-family: Nunito, sans-serif; }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spin-slow 1.2s linear infinite; }
    .subpage-enter { animation: subIn 0.35s ease-out; }
    @keyframes subIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    .toast-enter { animation: toastIn 0.3s ease-out; }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 24px) scale(0.92); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  </style>
</head>
<body class="min-h-screen m-0 overflow-auto" style="background: linear-gradient(135deg, #fef6ff 0%, #fdf2ff 30%, #f0e8ff 60%, #fce7f3 100%); font-family: Nunito, sans-serif;">

  <!-- Ambient -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute rounded-full opacity-20" style="width:360px;height:360px;background:#c084fc;top:-120px;left:-120px;filter:blur(90px)"></div>
    <div class="absolute rounded-full opacity-15" style="width:300px;height:300px;background:#f9a8d4;bottom:-100px;right:-100px;filter:blur(80px)"></div>
  </div>

  <div id="app-root" class="min-h-screen flex items-center justify-center overflow-hidden p-4 box-border"></div>

    ],

  const modes = [
    { id: 'outline', label: '纯线稿', emoji: '✏️' },
    { id: 'dots', label: '连点', emoji: '🔗' },
    { id: 'numbers', label: '数字', emoji: '🔢' },
    { id: 'letters', label: '字母', emoji: '🔤' },

  const themes = [
    { id: 'farm', label: '农场生活', emoji: '🌾', scene: '🚜🌾🌳', color: 'linear-gradient(135deg,#d1fae5,#fef3c7)' },
    { id: 'ocean', label: '海洋世界', emoji: '🌊', scene: '🐚🌊🪸', color: 'linear-gradient(135deg,#dbeafe,#cffafe)' },
    { id: 'forest', label: '神秘森林', emoji: '🌲', scene: '🌲🍄🌿', color: 'linear-gradient(135deg,#d1fae5,#bbf7d0)' },
    { id: 'space', label: '宇宙探险', emoji: '🚀', scene: '🌌⭐🪐', color: 'linear-gradient(135deg,#e0e7ff,#ddd6fe)' },
    { id: 'city', label: '城市冒险', emoji: '🏙️', scene: '🏙️🚦🌳', color: 'linear-gradient(135deg,#fed7aa,#fde68a)' },

  const palette = {
    farm: { characters: [{ emoji: '👩‍🌾', name: '农场主' }, { emoji: '🧒', name: '小孩' }, { emoji: '🐄', name: '奶牛' }], items: [{ emoji: '🌽', name: '玉米' }, { emoji: '🍎', name: '苹果' }, { emoji: '🥕', name: '胡萝卜' }] },
    ocean: { characters: [{ emoji: '🧜‍♀️', name: '美人鱼' }, { emoji: '🐠', name: '热带鱼' }, { emoji: '🐙', name: '章鱼' }], items: [{ emoji: '🐚', name: '贝壳' }, { emoji: '🪸', name: '珊瑚' }, { emoji: '⚓', name: '船锚' }] },

  const typeColors = { 涂鸦: '#a855f7', 线稿: '#3b82f6', 安静书: '#f59e0b' };

  const state = {
    activeTab: null,
    showSettings: false,
    works: [],
    printToast: null,
    voice: { listening: false, transcript: '', generating: false, images: [], saved: {}, printed: {} },
    line: { cat: '动物', search: '', mode: 'outline', preview: null, saved: false, printed: false, listening: false, transcript: '', generating: false },
    book: { page: 'home', themeId: null, scene: null, placed: [], tab: 'characters', printedScene: false, saved: false },
    timers: [],
  };

  function showToast(emoji, desc) {
    state.printToast = { emoji, desc };
    render();
    clearTimeout(state._toastT);
    state._toastT = setTimeout(() => { state.printToast = null; render(); }, 3000);
  }

  function addWork(emoji, desc, type) {
    const id = String(Date.now());
    const date = new Date().toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    state.works.unshift({ id, emoji, desc, type, date, starred: false });
    showToast(emoji, desc);
  }

  function iconWifi() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>'; }
  function iconBattery() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>'; }
  function iconVol() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>'; }
  function iconSettings() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'; }

  function iconMic(on) { return on
    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V5a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>'
    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>'; }
  function iconPrinter() { return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'; }

  function iconSearch() { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'; }
  function iconStar(filled) { return '<svg width="14" height="14" viewBox="0 0 24 24" ' + (filled ? 'fill="#f59e0b" stroke="#f59e0b"' : 'fill="none" stroke="#c4b5d4"') + ' stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>'; }

  function statusPill(iconHtml, label, tint, bg) {
    return '<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full font-nunito text-xs font-bold" style="background:' + bg + ';color:' + tint + '">' + iconHtml + '<span>' + label + '</span></div>';

  function renderTopBar() {

      + '<div class="flex items-center gap-3">'
      + '<div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 4px 12px rgba(168,85,247,0.3)"><span style="font-size:22px">🧸</span></div>'
      + '<div class="flex flex-col leading-tight">'
      + '<span class="font-fredoka text-[22px] tracking-wide" style="color:#7e22ce">奇想印印</span>'
      + '<span class="font-nunito text-[11px]" style="color:#a78bba">儿童打印站 ✨</span></div></div>'
      + '<div class="flex items-center gap-3 flex-wrap justify-end">'
      + statusPill(iconWifi(), 'Wi-Fi 已连接', '#a855f7', '#f3e8ff')

      + statusPill(iconVol(), '安静模式', '#db2777', '#fce7f3')

  }

  function renderBottomBar() {
    return '<div class="flex items-center justify-between px-6 py-3" style="background:linear-gradient(90deg,rgba(252,231,243,0.9),rgba(243,232,255,0.9));border-top:2px solid rgba(192,132,252,0.18)">'

  function renderHomeMenu() {
    return '<div class="flex-1 flex items-center justify-center px-8"><div class="grid grid-cols-2 sm:grid-cols-4 gap-6 w-full max-w-3xl">'

        + '<div class="rounded-full flex items-center justify-center relative" style="width:130px;height:130px;background:' + tab.gradient + ';border:5px solid ' + tab.ring + ';box-shadow:0 12px 28px rgba(168,85,247,0.22),inset 0 -6px 14px rgba(0,0,0,0.06),inset 0 4px 10px rgba(255,255,255,0.55)">'
        + '<span style="font-size:64px;filter:drop-shadow(0 3px 4px rgba(0,0,0,0.12))">' + tab.emoji + '</span>'
        + '<div class="absolute rounded-full" style="width:28px;height:14px;top:18px;left:28px;background:rgba(255,255,255,0.55);filter:blur(4px);transform:rotate(-25deg)"></div></div>'

      )).join('') + '</div></div>';
  }

  function renderVoicePanel() {
    const v = state.voice;
    let body = '';
    if (v.generating) {
      body = '<div class="flex flex-col items-center gap-2"><div class="w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin-slow"></div><span class="font-nunito text-sm" style="color:#7c6a90">AI 同时创作两个版本...</span></div>';
    } else if (!v.images.length) {
      body = '<div class="flex flex-col items-center gap-2 opacity-60"><span style="font-size:36px">✨</span><span class="font-nunito text-sm" style="color:#a78bba">说出你的想法，AI 一次画两张哦 🎨</span></div>';
    } else {
      body = '<div class="flex flex-1 items-center justify-center gap-4 min-h-0 flex-wrap">' + v.images.map((img, idx) => (
        '<div class="flex flex-col gap-2" style="flex:1 1 45%;min-width:140px;max-width:48%">'
        + '<div class="rounded-2xl flex flex-col items-center justify-center relative w-full" style="aspect-ratio:210/148;background:' + img.bg + ';border:3px dashed rgba(168,85,247,0.3);box-shadow:0 8px 24px rgba(168,85,247,0.15)">'
        + '<span class="absolute top-2 left-2 px-2 py-0.5 rounded-full font-nunito text-[9px] font-bold" style="background:rgba(255,255,255,0.75);color:#7e22ce">版本 ' + (idx + 1) + '</span>'
        + '<span style="font-size:72px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1))">' + img.emoji + '</span>'
        + '<span class="font-fredoka text-[13px] mt-1" style="color:#5b21b6">' + img.desc + '</span></div>'
        + '<div class="flex gap-2">'
        + '<button type="button" class="voice-save flex-1 py-1.5 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-[11px] border-none active:scale-95" data-img-id="' + img.id + '" style="background:' + (v.saved[img.id] ? '#dcfce7' : '#f3e8ff') + ';color:' + (v.saved[img.id] ? '#15803d' : '#7e22ce') + '">' + iconDownload() + (v.saved[img.id] ? '已保存' : '保存') + '</button>'
        + '<button type="button" class="voice-print flex-1 py-1.5 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-[11px] border-none active:scale-95" data-img-id="' + img.id + '" ' + (v.printed[img.id] ? 'disabled' : '') + ' style="background:' + (v.printed[img.id] ? '#dcfce7' : 'linear-gradient(135deg,#a855f7,#ec4899)') + ';color:' + (v.printed[img.id] ? '#15803d' : 'white') + '">' + iconPrinter() + (v.printed[img.id] ? '已打印' : '打印') + '</button>'
        + '</div></div>'
      )).join('') + '</div>';
    }
    return '<div class="flex flex-col h-full p-4 gap-3 overflow-auto">'
      + '<div class="flex items-center gap-3 rounded-2xl px-4 py-3 shrink-0" style="background:linear-gradient(135deg,#fdf4ff,#fce7f3);border:2px dashed rgba(192,132,252,0.3)">'
      + '<button type="button" id="voice-mic" class="relative w-14 h-14 rounded-full flex items-center justify-center shadow-lg shrink-0 border-4 border-white active:scale-95" style="background:' + (v.listening ? 'linear-gradient(135deg,#f43f5e,#ec4899)' : 'linear-gradient(135deg,#a855f7,#c084fc)') + '">' + iconMic(v.listening) + '</button>'
      + '<div class="flex-1 min-w-0"><div class="font-fredoka text-sm" style="color:#7e22ce">🎨 语音涂鸦</div>'
      + (v.transcript ? '<div class="truncate font-nunito text-xs" style="color:#3d2a5a">「' + v.transcript + '」' + (v.generating ? ' · AI 正在画...' : '') + '</div>'
        : '<div class="font-nunito text-xs" style="color:#a78bba">' + (v.listening ? '🎙️ 正在听你说话...' : v.generating ? '✨ AI 正在画两张图...' : '按下麦克风，说出你想画的内容 ✨') + '</div>')
      + '</div>'
      + (!v.generating && v.images.length ? '<button type="button" id="voice-regen" class="shrink-0 px-3 py-1.5 rounded-full flex items-center gap-1 font-nunito font-bold text-xs border-2 active:scale-95" style="background:white;border-color:#c084fc;color:#7e22ce">✨ 再画</button>' : '')
      + '</div>'
      + '<div class="flex-1 flex items-center justify-center min-h-[120px]">' + body + '</div></div>';
  }

  function allLineItems() {
    return Object.values(lineArtData).flat();
  }

  function filteredLine() {
    const s = state.line;
    if (s.search) return allLineItems().filter(i => i.name.includes(s.search));
    return lineArtData[s.cat] || [];
  }

  function modeBadge(mode) {
    const m = modes.find(x => x.id === mode);
    return '<span class="absolute top-2 right-2 px-2 py-0.5 rounded-full font-nunito text-[9px] font-bold" style="background:rgba(255,255,255,0.88);color:#7e22ce">' + m.emoji + ' ' + m.label + '</span>';
  }

  function previewMarks(mode) {
    if (mode === 'outline') return '';
    const marks = mode === 'dots' ? ['·1','·2','·3','·4','·5','·6','·7','·8'] : mode === 'numbers' ? ['1','2','3','4','5','6','7','8'] : ['A','B','C','D','E','F','G','H'];
    const pos = [
      { top: '18%', left: '15%' }, { top: '15%', left: '76%' }, { top: '38%', left: '10%' }, { top: '40%', left: '82%' },
      { top: '62%', left: '14%' }, { top: '60%', left: '78%' }, { top: '80%', left: '30%' }, { top: '82%', left: '63%' },
    ];
    return marks.map((t, i) => '<span class="absolute font-nunito text-[11px] font-bold" style="top:' + pos[i].top + ';left:' + pos[i].left + ';color:#a855f7">' + t + '</span>').join('');
  }

  function renderLinePanel() {
    const s = state.line;
    const list = filteredLine();
    const key = s.preview ? s.preview.name + '-' + s.mode : '';
    const left = '<div class="w-full sm:w-[44%] flex flex-col gap-2 min-h-0">'
      + '<div class="flex items-center gap-2 rounded-xl px-3 py-2 shrink-0" style="background:#f3e8ff;border:2px solid rgba(168,85,247,0.2)">' + iconSearch().replace('stroke="currentColor"', 'stroke="#a855f7"')
      + '<input id="line-search" class="flex-1 bg-transparent outline-none font-nunito text-xs min-w-0" style="color:#3d2a5a" placeholder="搜索线稿模板..." value="' + (s.search || '') + '"/></div>'
      + (!s.search ? '<div class="flex gap-1.5 flex-wrap shrink-0">' + categories.map(cat => (
        '<button type="button" class="line-cat px-3 py-1 rounded-full font-nunito font-bold text-[11px] border-none active:scale-95" data-cat="' + cat + '" style="background:' + (s.cat === cat ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#f3e8ff') + ';color:' + (s.cat === cat ? 'white' : '#7c6a90') + '">' + cat + '</button>'
      )).join('') + '</div>' : '')
      + '<div class="grid grid-cols-2 gap-2 flex-1 overflow-y-auto pr-1 content-start max-h-[40vh] sm:max-h-none">'
      + list.map(item => (
        '<button type="button" class="line-pick flex flex-col gap-1 rounded-xl p-1.5 cursor-pointer active:scale-95 text-left" data-name="' + item.name + '" style="background:' + (s.preview && s.preview.name === item.name ? 'linear-gradient(135deg,#fbcfe8,#ddd6fe)' : 'white') + ';border:' + (s.preview && s.preview.name === item.name ? '2px solid #c084fc' : '2px solid rgba(168,85,247,0.15)') + ';box-shadow:0 2px 8px rgba(168,85,247,0.08)">'
        + '<div class="w-full rounded-lg flex items-center justify-center relative overflow-hidden" style="aspect-ratio:210/148;background:' + item.bg + ';filter:grayscale(0.35)"><span style="font-size:34px">' + item.emoji + '</span></div>'
        + '<span class="text-center font-nunito text-[10px]" style="color:#7c6a90">' + item.name + '</span></button>'
      )).join('') + '</div></div>';

    const rightPreview = s.preview
      ? '<div class="rounded-2xl flex flex-col items-center justify-center relative w-full" style="aspect-ratio:210/148;max-height:100%;background:' + s.preview.bg + ';border:3px dashed rgba(168,85,247,0.35);box-shadow:0 8px 24px rgba(168,85,247,0.15);filter:grayscale(0.55)">'
        + modeBadge(s.mode) + previewMarks(s.mode)
        + '<span style="font-size:84px;opacity:0.6">' + s.preview.emoji + '</span>'
        + '<span class="font-fredoka text-[13px] mt-0.5" style="color:#5b21b6">' + s.preview.name + '</span></div>'
      : '<div class="flex flex-col items-center gap-2 opacity-60"><span style="font-size:30px">✨</span><span class="font-nunito text-xs sm:text-sm" style="color:#a78bba">' + (s.generating ? 'AI 正在生成线稿...' : '语音生成 或 从左边挑模板') + '</span></div>';

    const rightBtns = s.preview ? '<div class="flex gap-2 shrink-0">'
      + '<button type="button" id="line-save" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-xs border-none active:scale-95" style="background:' + (s.saved ? '#dcfce7' : '#f3e8ff') + ';color:' + (s.saved ? '#15803d' : '#7e22ce') + '">' + iconDownload() + (s.saved ? '已保存' : '保存') + '</button>'
      + '<button type="button" id="line-print" class="flex-1 py-2 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-xs border-none active:scale-95" ' + (s.printed ? 'disabled' : '') + ' style="background:' + (s.printed ? '#dcfce7' : 'linear-gradient(135deg,#a855f7,#ec4899)') + ';color:' + (s.printed ? '#15803d' : 'white') + '">' + iconPrinter() + (s.printed ? '已打印' : '打印') + '</button>'
      + '</div>' : '';

    return '<div class="flex flex-col h-full p-4 gap-3 overflow-hidden">'
      + '<div class="flex items-center gap-3 rounded-2xl px-4 py-3 shrink-0" style="background:linear-gradient(135deg,#fdf4ff,#fce7f3);border:2px dashed rgba(192,132,252,0.3)">'
      + '<button type="button" id="line-mic" class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg shrink-0 border-[3px] border-white active:scale-95" style="background:' + (s.listening ? 'linear-gradient(135deg,#f43f5e,#ec4899)' : 'linear-gradient(135deg,#a855f7,#c084fc)') + '">' + iconMic(s.listening) + '</button>'
      + '<div class="flex-1 min-w-0"><div class="font-fredoka text-sm" style="color:#7e22ce">✏️ 语音生成线稿</div>'
      + (s.transcript ? '<div class="truncate font-nunito text-xs" style="color:#3d2a5a">「' + s.transcript + '」' + (s.generating ? ' · 生成中...' : '') + '</div>'
        : '<div class="font-nunito text-xs" style="color:#a78bba">' + (s.listening ? '🎙️ 正在听...' : '说出你想要的线稿，或从下方挑选模板') + '</div>') + '</div></div>'
      + '<div class="flex flex-col sm:flex-row gap-4 flex-1 min-h-0 overflow-hidden">' + left
      + '<div class="flex-1 flex flex-col gap-2 min-h-0">'
      + '<div class="grid grid-cols-4 gap-1.5 shrink-0">' + modes.map(m => (
        '<button type="button" class="line-mode py-1.5 rounded-xl flex flex-col items-center gap-0.5 font-nunito font-bold border-none active:scale-95" data-mode="' + m.id + '" style="background:' + (s.mode === m.id ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#f3e8ff') + ';color:' + (s.mode === m.id ? 'white' : '#7c6a90') + '"><span style="font-size:14px">' + m.emoji + '</span><span style="font-size:10px">' + m.label + '</span></button>'
      )).join('') + '</div>'
      + '<div class="flex-1 flex items-center justify-center min-h-0 overflow-hidden">' + rightPreview + '</div>' + rightBtns + '</div></div></div>';
  }

  function renderBookHome() {
    const b = state.book;
    return '<div class="flex flex-col h-full p-4 gap-3 overflow-auto">'
      + '<p class="font-nunito text-xs shrink-0" style="color:#7c6a90">挑一个场景主题，再往里加人物和物品 ✨</p>'
      + '<div class="grid grid-cols-2 gap-2 flex-1 min-h-0 content-start">' + themes.map(t => (
        '<button type="button" class="book-theme rounded-2xl px-4 py-3 flex items-center gap-3 font-nunito font-bold text-sm border-none active:scale-95 text-left" data-theme="' + t.id + '" style="background:' + (b.themeId === t.id ? 'linear-gradient(135deg,#a855f7,#ec4899)' : t.color) + ';color:' + (b.themeId === t.id ? 'white' : '#3d2a5a') + ';border:' + (b.themeId === t.id ? 'none' : '2px solid rgba(168,85,247,0.18)') + '">'
        + '<span style="font-size:28px">' + t.emoji + '</span><div class="flex flex-col items-start"><span>' + t.label + '</span>'
        + '<span style="font-size:11px;opacity:0.7;font-weight:400">' + (palette[t.id].characters.map(c => c.emoji).join(' ')) + '</span></div></button>'
      )).join('') + '</div>'
      + '<button type="button" id="book-gen" class="w-full py-3 rounded-2xl flex items-center justify-center gap-2 font-fredoka text-[15px] border-none active:scale-95 shrink-0" '
      + (!b.themeId ? 'disabled ' : '')
      + 'style="background:linear-gradient(135deg,#f59e0b,#f97316);color:white;opacity:' + (b.themeId ? '1' : '0.5') + '">✨ 生成场景</button></div>';
  }

  function renderBookEditor() {
    const b = state.book;
    const t = b.scene;
    const pal = palette[t.id];
    const list = b.tab === 'characters' ? pal.characters : pal.items;
    return '<div class="flex flex-col h-full p-4 gap-3 overflow-hidden">'
      + '<div class="flex items-center gap-3 rounded-2xl px-4 py-3 shrink-0 overflow-x-auto" style="background:linear-gradient(135deg,#fdf4ff,#fce7f3);border:2px dashed rgba(192,132,252,0.3)">'
      + '<button type="button" id="book-back-home" class="flex items-center gap-1 px-3 py-2 rounded-xl font-nunito font-bold text-xs border-none shrink-0 active:scale-95" style="background:rgba(168,85,247,0.12);color:#7e22ce">' + iconArrow().replace('width="18"', 'width="14"').replace('height="18"', 'height="14"') + '换场景</button>'
      + '<div class="font-fredoka text-xs shrink-0" style="color:#7e22ce">' + t.emoji + ' ' + t.label + '</div></div>'
      + '<div class="flex gap-3 flex-1 min-h-0 overflow-hidden">'
      + '<div class="w-[30%] min-w-[100px] flex flex-col gap-2 min-h-0">'
      + '<div class="grid grid-cols-2 gap-1.5 shrink-0">'
      + '<button type="button" class="book-tab py-1.5 rounded-xl font-nunito font-bold text-[11px] border-none" data-btab="characters" style="background:' + (b.tab === 'characters' ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#f3e8ff') + ';color:' + (b.tab === 'characters' ? 'white' : '#7c6a90') + '">👫 人物</button>'
      + '<button type="button" class="book-tab py-1.5 rounded-xl font-nunito font-bold text-[11px] border-none" data-btab="items" style="background:' + (b.tab === 'items' ? 'linear-gradient(135deg,#a855f7,#ec4899)' : '#f3e8ff') + ';color:' + (b.tab === 'items' ? 'white' : '#7c6a90') + '">🎁 物品</button></div>'
      + '<div class="rounded-2xl p-2 flex-1 min-h-0 overflow-y-auto" style="background:#faf5ff;border:2px solid rgba(192,132,252,0.2)">'
      + '<div class="grid grid-cols-2 gap-1.5">' + list.map((item, i) => (
        '<button type="button" class="book-add rounded-xl flex flex-col items-center justify-center gap-0.5 p-1 border-none active:scale-90" style="background:white;border:2px solid rgba(168,85,247,0.18);aspect-ratio:1" data-emoji="' + item.emoji + '" data-name="' + item.name + '">'
        + '<span style="font-size:22px">' + item.emoji + '</span><span class="font-nunito text-[9px]" style="color:#7c6a90">' + item.name + '</span></button>'
      )).join('') + '</div></div>'
      + (b.placed.length ? '<div class="rounded-xl p-2 shrink-0 font-nunito text-[10px]" style="background:#f3e8ff;border:2px solid rgba(192,132,252,0.2);max-height:80px;overflow-y:auto">已加入 ' + b.placed.length + ' 个</div>' : '')
      + '<button type="button" id="book-clear" class="py-1.5 rounded-xl font-nunito font-bold text-[11px] border-none shrink-0" style="background:#fee2e2;color:#b91c1c" ' + (!b.placed.length ? 'disabled' : '') + '>清空场景</button></div>'
      + '<div class="flex-1 flex flex-col gap-2 min-h-0">'
      + '<div class="flex-1 flex items-center justify-center min-h-0">'
      + '<div class="rounded-2xl relative overflow-hidden w-full" style="aspect-ratio:210/148;max-height:100%;background:' + t.color + ';border:3px dashed rgba(168,85,247,0.3);box-shadow:0 8px 24px rgba(168,85,247,0.15)">'
      + '<div class="absolute inset-0 flex items-end justify-center pb-4 opacity-20 pointer-events-none select-none"><span style="font-size:56px">' + t.scene + '</span></div>'
      + '<div class="absolute top-2 left-2 px-2 py-0.5 rounded-full font-nunito text-[9px] font-bold" style="background:rgba(255,255,255,0.82);color:#7e22ce">' + t.emoji + ' ' + t.label + '</div>'
      + b.placed.map(p => '<button type="button" class="book-placed absolute border-none bg-transparent cursor-pointer" style="left:' + p.x + '%;top:' + p.y + '%;transform:translate(-50%,-50%);font-size:' + p.size + 'px;filter:drop-shadow(0 3px 4px rgba(0,0,0,0.15))" data-id="' + p.id + '">' + p.emoji + '</button>').join('')
      + (!b.placed.length ? '<div class="absolute inset-0 flex items-center justify-center pointer-events-none font-nunito text-xs" style="color:#7e22ce;opacity:0.5">从左边选人物或物品加入场景 ✨</div>' : '')
      + '</div></div>'
      + '<div class="flex gap-2 shrink-0 flex-wrap">'
      + '<button type="button" id="book-save" class="flex-1 min-w-[80px] py-2 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-[11px] border-none" style="background:' + (b.saved ? '#dcfce7' : '#f3e8ff') + ';color:' + (b.saved ? '#15803d' : '#7e22ce') + '">' + iconDownload() + (b.saved ? '已保存' : '保存') + '</button>'
      + '<button type="button" id="book-print-scene" class="flex-1 min-w-[80px] py-2 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-[11px] border-none" style="background:' + (b.printedScene ? '#dcfce7' : '#f3e8ff') + ';color:' + (b.printedScene ? '#15803d' : '#7e22ce') + '">' + iconPrinter() + '打印场景</button>'
      + '<button type="button" id="book-print-full" class="flex-1 min-w-[80px] py-2 rounded-xl flex items-center justify-center gap-1 font-nunito font-bold text-[11px] border-none" style="background:linear-gradient(135deg,#a855f7,#ec4899);color:white">' + iconPrinter().replace('stroke="currentColor"', 'stroke="white"') + '打印全图</button>'
      + '</div></div></div></div>';
  }

  function renderBookPanel() {
    return state.book.page === 'editor' && state.book.scene ? renderBookEditor() : renderBookHome();
  }

  function renderWorksPanel() {
    const w = state.works;
    if (!w.length) {
      return '<div class="flex flex-col items-center justify-center h-full gap-4 p-8">'
        + '<span style="font-size:64px">🎨</span>'
        + '<h3 class="font-fredoka text-center text-xl" style="color:#3d2a5a">还没有作品哦！</h3>'
        + '<p class="text-xs text-center font-nunito leading-relaxed" style="color:#7c6a90">去语音互动、搜索线稿或生成安静书，打印后就能在这里看到啦 ✨</p></div>';
    }
    const starred = w.filter(x => x.starred);
    const others = w.filter(x => !x.starred);
    function card(work) {
      const tc = typeColors[work.type] || '#a855f7';
      const tb = typeBg[work.type] || '#f3e8ff';
      return '<div class="flex items-center gap-3 rounded-2xl p-3" style="background:white;border:2px solid rgba(168,85,247,0.12);box-shadow:0 2px 12px rgba(168,85,247,0.07)">'
        + '<div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background:' + tb + '"><span style="font-size:26px">' + work.emoji + '</span></div>'
        + '<div class="flex-1 min-w-0"><p class="truncate text-sm font-nunito font-bold" style="color:#3d2a5a">' + work.desc + '</p>'
        + '<div class="flex items-center gap-1 mt-0.5"><span class="text-xs px-2 py-0.5 rounded-full font-nunito font-bold" style="background:' + tb + ';color:' + tc + '">' + work.type + '</span>'
        + '<span class="text-xs font-nunito" style="color:#c4b5d4">' + work.date + '</span></div></div>'
        + '<div class="flex flex-col gap-1 shrink-0">'
        + '<button type="button" class="work-star p-1.5 rounded-lg border-none cursor-pointer active:scale-90" style="background:' + (work.starred ? '#fef3c7' : '#f8f4ff') + '" data-id="' + work.id + '">' + iconStar(work.starred) + '</button>'
        + '<button type="button" class="work-print p-1.5 rounded-lg border-none cursor-pointer active:scale-90" style="background:#f3e8ff" data-id="' + work.id + '">' + iconPrinter().replace('width="12"', 'width="14"').replace('height="12"', 'height="14"').replace('stroke="currentColor"', 'stroke="#a855f7"') + '</button>'
        + '<button type="button" class="work-del p-1.5 rounded-lg border-none cursor-pointer active:scale-90" style="background:#fff1f2" data-id="' + work.id + '">' + iconTrash() + '</button>'
        + '</div></div>';
    }
    let html = '<div class="flex flex-col gap-3 p-4 h-full overflow-y-auto">'
      + '<div class="flex items-center justify-between"><span class="text-xs font-nunito" style="color:#7c6a90">共 ' + w.length + ' 件作品</span>'
      + '<div class="flex items-center gap-1 text-xs font-nunito font-bold" style="color:#f59e0b">' + iconStar(true).replace('width="14"', 'width="12"').replace('height="14"', 'height="12"') + starred.length + ' 收藏</div></div>';
    if (starred.length) {
      html += '<p class="text-xs font-nunito font-bold" style="color:#f59e0b">⭐ 我的收藏</p>' + starred.map(card).join('<div class="h-2"></div>');
      html += '<div class="h-2"></div>';
    }
    if (others.length) {
      if (starred.length) html += '<p class="text-xs font-nunito font-bold" style="color:#7c6a90">全部作品</p>';
      html += others.map(card).join('<div class="h-2"></div>');
    }
    return html + '</div>';
  }

  function renderSettings() {
    const rows = [
      { icon: '🔊', label: '声音', value: '安静模式' },
      { icon: '📶', label: 'Wi-Fi', value: '家里的小窝 · 已连接' },
      { icon: '🔋', label: '电量', value: '100%' },
      { icon: '🎀', label: '主题颜色', value: '粉紫毛绒' },
      { icon: '👶', label: '儿童锁', value: '已开启' },
      { icon: 'ℹ️', label: '关于打印机', value: '奇想印印 v1.0' },
    ];
    return '<div class="subpage-enter absolute inset-0 z-20 flex flex-col" style="background:linear-gradient(180deg,#faf5ff 0%,#fef3f9 100%)">'
      + '<div class="flex items-center gap-3 px-6 py-3" style="background:linear-gradient(135deg,#c4b5fd,#fbcfe8);border-bottom:3px solid #c084fc">'
      + '<button type="button" id="settings-back" class="flex items-center gap-2 px-3 py-2 rounded-full font-nunito font-bold text-[13px] border-none active:scale-95" style="background:rgba(255,255,255,0.32);color:white">' + iconArrow() + '<span>返回</span></button>'
      + '<div class="flex items-center gap-2 ml-2">' + iconSettings().replace('width="16"', 'width="22"').replace('height="16"', 'height="22"').replace('stroke="currentColor"', 'stroke="#5b21b6"')
      + '<span class="font-fredoka text-xl" style="color:#5b21b6">设置</span></div></div>'
      + '<div class="flex-1 overflow-y-auto p-6"><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-w-3xl mx-auto">'
      + rows.map(r => (
        '<div class="flex items-center gap-3 px-4 py-3 rounded-2xl" style="background:white;border:2px solid rgba(192,132,252,0.2);box-shadow:0 2px 8px rgba(168,85,247,0.06)">'
        + '<span style="font-size:26px">' + r.icon + '</span><div class="flex flex-col">'
        + '<span class="font-fredoka text-sm" style="color:#7e22ce">' + r.label + '</span>'
        + '<span class="font-nunito text-[11px]" style="color:#a78bba">' + r.value + '</span></div></div>'
      )).join('') + '</div></div></div>';
  }

  function renderSubPage() {
    if (!state.activeTab || state.showSettings) return '';
    const tab = tabs.find(t => t.id === state.activeTab);
    let inner = '';
    if (state.activeTab === 'voice') inner = renderVoicePanel();
    else if (state.activeTab === 'search') inner = renderLinePanel();
    else if (state.activeTab === 'book') inner = renderBookPanel();
    else inner = renderWorksPanel();

    return '<div class="subpage-enter absolute inset-0 z-20 flex flex-col" style="background:linear-gradient(180deg,#faf5ff 0%,#fef3f9 100%)">'
      + '<div class="flex items-center gap-3 px-6 py-3 shrink-0" style="background:' + tab.gradient + ';color:white;border-bottom:3px solid ' + tab.ring + '">'
      + '<button type="button" id="sub-back" class="flex items-center gap-2 px-3 py-2 rounded-full font-nunito font-bold text-[13px] border-none active:scale-95" style="background:rgba(255,255,255,0.32);color:white" aria-label="返回">' + iconArrow() + '<span>返回</span></button>'
      + '<div class="flex items-center gap-2 ml-2"><span style="font-size:26px">' + tab.emoji + '</span>'
      + '<div class="flex flex-col leading-tight">'
      + '<span class="font-fredoka text-xl" style="color:#5b21b6">' + tab.label + '</span>'
      + '<span class="font-nunito text-[11px]" style="color:rgba(91,33,182,0.75)">' + tab.subtitle + '</span></div></div></div>'
      + '<div class="flex-1 min-h-0 overflow-hidden">' + inner + '</div></div>';
  }

  function renderToast() {
    if (!state.printToast) return '';
    const t = state.printToast;
    return '<div id="print-toast" class="toast-enter absolute bottom-20 left-1/2 -translate-x-1/2 flex items-center gap-3 px-5 py-3 rounded-2xl shadow-xl z-30 max-w-[340px]" style="background:linear-gradient(135deg,#a855f7,#ec4899);color:white">'
      + '<span style="font-size:28px">' + t.emoji + '</span>'
      + '<div class="flex flex-col"><span class="font-fredoka text-sm">正在打印中... 🖨️</span>'
      + '<span class="font-nunito text-[11px] opacity-85">' + t.desc + '</span></div>'
      + '<button type="button" id="toast-close" class="ml-auto border-none bg-transparent text-white opacity-70 hover:opacity-100 text-xl cursor-pointer">×</button></div>';
  }

  function render() {
    const root = document.getElementById('app-root');
    const workHint = state.works.length ? '<p class="text-center mt-3 font-nunito text-xs" style="color:#a78bba">你已经打印了 <span style="color:#7e22ce;font-weight:700">' + state.works.length + '</span> 个作品啦 🌟</p>' : '';

    root.innerHTML = ''
      + '<div class="relative flex flex-col w-full max-w-[1024px] max-h-[94vh]" style="aspect-ratio:16/10;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-radius:36px;border:6px solid #e9d5ff;box-shadow:0 24px 60px rgba(168,85,247,0.22),0 6px 20px rgba(168,85,247,0.12),inset 0 1px 0 rgba(255,255,255,0.9),0 0 0 12px rgba(243,232,255,0.5);overflow:hidden">'
      + renderTopBar()
      + '<div class="flex-1 flex flex-col py-4 min-h-0 overflow-hidden">'
      + renderHomeMenu() + workHint + '</div>'
      + renderBottomBar()
      + (state.showSettings ? renderSettings() : renderSubPage())
      + renderToast()
      + '</div>';

    wire();
  }

  function wire() {
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => { state.activeTab = btn.getAttribute('data-tab'); render(); });
    });
    const st = document.getElementById('btn-settings');
    if (st) st.addEventListener('click', () => { state.showSettings = true; render(); });
    const sb = document.getElementById('sub-back');
    if (sb) sb.addEventListener('click', () => { state.activeTab = null; render(); });
    const sbb = document.getElementById('settings-back');
    if (sbb) sbb.addEventListener('click', () => { state.showSettings = false; render(); });
    const tc = document.getElementById('toast-close');
    if (tc) tc.addEventListener('click', () => { state.printToast = null; render(); });

    const vm = document.getElementById('voice-mic');
    if (vm) vm.addEventListener('click', onVoiceMic);
    const vr = document.getElementById('voice-regen');
    if (vr) vr.addEventListener('click', () => { genVoiceImages(); });

    document.querySelectorAll('.voice-save').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-img-id');
      state.voice.saved[id] = true; render();
    }));
    document.querySelectorAll('.voice-print').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-img-id');
      const img = state.voice.images.find(x => x.id === id);
      if (img && !state.voice.printed[id]) {
        state.voice.printed[id] = true;
        addWork(img.emoji, img.desc, '涂鸦');
        render();
      }
    }));

    const ls = document.getElementById('line-search');
    if (ls) ls.addEventListener('input', e => { state.line.search = e.target.value; render(); });
    document.querySelectorAll('.line-cat').forEach(b => b.addEventListener('click', e => {
      state.line.cat = e.currentTarget.getAttribute('data-cat'); state.line.preview = null; state.line.saved = false; state.line.printed = false; render();
    }));
    document.querySelectorAll('.line-pick').forEach(b => b.addEventListener('click', e => {
      const name = e.currentTarget.getAttribute('data-name');
      const item = allLineItems().find(x => x.name === name);
      state.line.preview = item; state.line.saved = false; state.line.printed = false; render();
    }));
    document.querySelectorAll('.line-mode').forEach(b => b.addEventListener('click', e => {
      state.line.mode = e.currentTarget.getAttribute('data-mode'); render();
    }));
    const lsv = document.getElementById('line-save');
    if (lsv) lsv.addEventListener('click', () => { state.line.saved = true; render(); });
    const lpr = document.getElementById('line-print');
    if (lpr) lpr.addEventListener('click', () => {
      if (!state.line.preview || state.line.printed) return;
      const m = modes.find(x => x.id === state.line.mode);
      addWork(state.line.preview.emoji, state.line.preview.name + ' · ' + m.label, '线稿');
      state.line.printed = true; render();
    });
    const lm = document.getElementById('line-mic');
    if (lm) lm.addEventListener('click', onLineMic);

    document.querySelectorAll('.book-theme').forEach(b => b.addEventListener('click', e => {
      state.book.themeId = e.currentTarget.getAttribute('data-theme'); render();
    }));
    const bg = document.getElementById('book-gen');
    if (bg) bg.addEventListener('click', () => {
      if (!state.book.themeId) return;
      const t = themes.find(x => x.id === state.book.themeId);
      state.book.scene = t;
      state.book.page = 'editor';
      state.book.placed = [];
      state.book.saved = false;
      state.book.printedScene = false;
      render();
    });
    const bh = document.getElementById('book-back-home');
    if (bh) bh.addEventListener('click', () => { state.book.page = 'home'; state.book.scene = null; render(); });
    document.querySelectorAll('.book-tab').forEach(b => b.addEventListener('click', e => {
      state.book.tab = e.currentTarget.getAttribute('data-btab'); render();
    }));
    document.querySelectorAll('.book-add').forEach(b => b.addEventListener('click', e => {
      const emoji = e.currentTarget.getAttribute('data-emoji');
      const name = e.currentTarget.getAttribute('data-name');
      state.book.placed.push({ id: String(Date.now() + Math.random()), emoji, name, x: 15 + Math.random() * 70, y: 20 + Math.random() * 55, size: 28 + Math.random() * 12 });
      render();
    }));
    document.querySelectorAll('.book-placed').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      state.book.placed = state.book.placed.filter(p => p.id !== id); render();
    }));
    const bc = document.getElementById('book-clear');
    if (bc) bc.addEventListener('click', () => { state.book.placed = []; render(); });
    const bsa = document.getElementById('book-save');
    if (bsa) bsa.addEventListener('click', () => { state.book.saved = true; render(); });
    const bps = document.getElementById('book-print-scene');
    if (bps) bps.addEventListener('click', () => {
      const t = state.book.scene;
      if (!t) return;
      addWork(t.emoji, t.label + ' · 背景场景', '安静书');
      state.book.printedScene = true; render();
    });
    const bpf = document.getElementById('book-print-full');
    if (bpf) bpf.addEventListener('click', () => {
      const t = state.book.scene;
      if (!t) return;
      addWork(t.emoji, t.label + ' · 完整画面', '安静书');
      state.book.printedScene = true; render();
    });

    document.querySelectorAll('.work-star').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      state.works = state.works.map(w => w.id === id ? { ...w, starred: !w.starred } : w); render();
    }));
    document.querySelectorAll('.work-print').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      const w = state.works.find(x => x.id === id);
      if (w) showToast(w.emoji, w.desc);
    }));
    document.querySelectorAll('.work-del').forEach(b => b.addEventListener('click', e => {
      const id = e.currentTarget.getAttribute('data-id');
      state.works = state.works.filter(w => w.id !== id); render();
    }));
  }

  function onVoiceMic() {
    const v = state.voice;
    if (v.generating) return;
    if (v.listening) { v.listening = false; clearTimers(); if (v.transcript) setTimeout(genVoiceImages, 400); render(); return; }
    v.listening = true; v.transcript = ''; v.images = []; v.saved = {}; v.printed = {};
    const p = prompts[Math.floor(Math.random() * prompts.length)];
    let i = 0;
    const t = setInterval(() => {
      i++; v.transcript = p.slice(0, i); render();
      if (i >= p.length) { clearInterval(t); v.listening = false; setTimeout(genVoiceImages, 400); }
    }, 55);
    state.timers.push(t);
    render();
  }

  function clearTimers() { state.timers.forEach(clearInterval); state.timers = []; }

  function genVoiceImages() {
    state.voice.generating = true; render();
    setTimeout(() => {
      const shuffled = [...imagePool].sort(() => Math.random() - 0.5);
      state.voice.images = shuffled.slice(0, 2).map((p, idx) => ({ ...p, id: Date.now() + '-' + idx }));
      state.voice.generating = false; render();
    }, 1500);
  }

  const voicePromptsLine = ['可爱的小恐龙', '美人鱼公主', '魔法独角兽', '森林精灵小屋'];

  function onLineMic() {
    const s = state.line;
    if (s.listening || s.generating) return;
    s.listening = true; s.transcript = '';
    const p = voicePromptsLine[Math.floor(Math.random() * voicePromptsLine.length)];
    let i = 0;
    const t = setInterval(() => {
      i++; s.transcript = p.slice(0, i); render();
      if (i >= p.length) {
        clearInterval(t); s.listening = false; s.generating = true; render();
        setTimeout(() => {
          const all = allLineItems();
          s.preview = all[Math.floor(Math.random() * all.length)];
          s.generating = false; s.saved = false; s.printed = false; render();
        }, 1500);
      }
    }, 55);
  }

  render();
})();
</script>
</body>
</html>
